name: Build Linux

# Genera el paquete .tar.gz de Linux x64 en Ubuntu 22.04 (glibc compatible).
# El código Flutter vive en TV/ dentro de este repositorio.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Configurar escritorio Linux
        run: flutter config --enable-linux-desktop

      - name: Compilar paquete
        working-directory: TV
        run: bash tools/build-linux.sh

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NexusStream-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error
